name: Unity Build

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Project
    runs-on:
      - self-hosted
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      # --- BUILD STEPS ---
      - name: Build Windows
        shell: cmd
        run: '"C:\Program Files\Unity\Hub\Editor\6000.4.11f1\Editor\Unity.exe" -batchmode -quit -projectPath "%GITHUB_WORKSPACE%\Mortier FU" -executeMethod BuildScript.BuildWindows -logFile -'

      - name: Build Linux
        if: github.ref == 'refs/heads/main'
        shell: cmd
        run: '"C:\Program Files\Unity\Hub\Editor\6000.4.11f1\Editor\Unity.exe" -batchmode -quit -projectPath "%GITHUB_WORKSPACE%\Mortier FU" -executeMethod BuildScript.BuildLinux -logFile -'

      - name: Build macOS
        if: github.ref == 'refs/heads/main'
        shell: cmd
        run: '"C:\Program Files\Unity\Hub\Editor\6000.4.11f1\Editor\Unity.exe" -batchmode -quit -projectPath "%GITHUB_WORKSPACE%\Mortier FU" -executeMethod BuildScript.BuildMacOS -logFile -'
            
      # --- STEAM DEPLOY ---
      - name: Deploy to Steam
        shell: cmd
        env:
          STEAM_USER: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASS: ${{ secrets.STEAM_PASSWORD }}
        run: |
            "C:\Users\t.druesne\Downloads\steamworks_sdk_164\sdk\tools\ContentBuilder\builder\steamcmd.exe" +login %STEAM_USER% %STEAM_PASS% +run_app_build "C:\Users\t.druesne\Downloads\steamworks_sdk_164\sdk\tools\ContentBuilder\scripts\app_4916100.vdf" +quit